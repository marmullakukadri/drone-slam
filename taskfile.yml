version: '3'

silent: true

vars:
  C: drone-slam-dev
  IMAGE: drone-slam:jazzy
  ROS: source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash
  URL: http://localhost:6080/vnc.html?autoconnect=true&resize=scale
  CURRENT_MAP:
    sh: cat maps/.current 2>/dev/null || echo home

tasks:
  default:
    cmds:
      - task --list

  docker:build:
    desc: Build the Docker image and create the container
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker Desktop is not running"
    cmds:
      - docker build -t {{.IMAGE}} .
      - |
        if docker container inspect {{.C}} >/dev/null 2>&1; then
          echo "Container {{.C}} already exists"
        else
          docker create -it --name {{.C}} -p 6080:6080 -v "$PWD":/workspace {{.IMAGE}} >/dev/null
          echo "Container {{.C}} created"
        fi

  build:
    desc: Build the ROS 2 package (colcon) inside the container
    cmds:
      - task: _up
      - bash src/drone_bringup/scripts/sync_check.sh {{.C}}
      - docker exec {{.C}} bash -c "source /opt/ros/jazzy/setup.bash && cd /workspace && colcon build --symlink-install"

  test:
    desc: Run the C++ unit tests (A* planner, 2D grid)
    cmds:
      - task: build
      - docker exec {{.C}} bash -c "source /opt/ros/jazzy/setup.bash && cd /workspace && colcon test --packages-select drone_control --event-handlers console_direct- >/dev/null; colcon test-result --verbose"

  run:dron:
    desc: "Localization on maps/home, send goals with RViz '2D Goal Pose' (Ctrl+C stops all)"
    vars:
      M: '{{.MAP | default "home"}}'
      SX: '{{.X | default "-6.5"}}'
      SY: '{{.Y | default "-0.6"}}'
      SYAW: '{{.YAW | default "0.0"}}'
    preconditions:
      - sh: test -f "maps/{{.M}}/rtabmap.db"
        msg: "No map in maps/{{.M}}/ - run: task run:map MAP={{.M}}, then task save"
    cmds:
      - echo "{{.M}}" > maps/.current
      - task: _run
        vars:
          ARGS: >-
            mode:=localization map_name:={{.M}}
            spawn_x:={{.SX}} spawn_y:={{.SY}} spawn_yaw:={{.SYAW}}

  run:map:
    desc: "New map, fly with 'task teleop', save with 'task save' (task run:map MAP=name)"
    vars:
      M: '{{.MAP | default "map1"}}'
    cmds:
      - |
        if [ -d "maps/{{.M}}" ]; then
          backup="maps/{{.M}}_$(date +%Y%m%d_%H%M%S)"
          mv "maps/{{.M}}" "$backup"
          echo "Old map moved to $backup"
        fi
        mkdir -p maps && echo "{{.M}}" > maps/.current
      - task: _run
        vars: { ARGS: "mode:=mapping map_name:={{.M}}" }

  run:demo:
    desc: The drone flies an automatic mission and builds maps/demo
    cmds:
      - echo demo > maps/.current
      - task: _run
        vars: { ARGS: "mode:=demo" }

  stop:
    desc: Stop the simulation (ROS 2 shutdown) and the container
    cmds:
      - |
        if [ -z "$(docker ps -q -f name=^{{.C}}$ -f status=running)" ]; then
          echo "Container is not running"; exit 0
        fi
        if docker exec {{.C}} pgrep -f "ros2 launch drone_bringup" >/dev/null; then
          echo "Stopping the simulation"
          docker exec {{.C}} bash -c "{{.ROS}} && ros2 topic pub --once -w 1 /drone/command std_msgs/msg/String '{data: shutdown}'" >/dev/null
          for i in $(seq 1 60); do
            docker exec {{.C}} pgrep -f "ros2 launch drone_bringup" >/dev/null || break
            sleep 1
          done
        fi
      - task: _down

  teleop:
    desc: "Keyboard window in the browser: arrows, u/d, q/e"
    preconditions:
      - sh: docker exec {{.C}} pgrep -f "ros2 launch drone_bringup" >/dev/null 2>&1
        msg: "Simulation is not running - start it with task run:map or task run:dron"
    cmds:
      - |
        if docker exec {{.C}} pgrep -f drone_teleop.py >/dev/null; then
          echo "Keyboard window is already open"
        else
          docker exec -d -e DISPLAY=:1 {{.C}} bash -c "{{.ROS}} && exec ros2 run drone_control drone_teleop.py > /tmp/drone_teleop.log 2>&1"
        fi
      - open '{{.URL}}'

  takeoff:
    desc: Take off to 1.5 m
    cmds:
      - task: _command
        vars: { CMD: takeoff }

  land:
    desc: Land
    cmds:
      - task: _command
        vars: { CMD: land }

  speed:
    desc: "Change drone speed while flying (task speed V=1.0 VZ=0.3 YAW=0.5)"
    preconditions:
      - sh: docker exec {{.C}} pgrep -f "ros2 launch drone_bringup" >/dev/null 2>&1
        msg: "Simulation is not running - to change the default speed edit src/drone_control/config/controller.yaml"
      - sh: '[ -n "{{.V}}{{.VZ}}{{.YAW}}" ]'
        msg: "Give at least one value: task speed V=1.0 (m/s), VZ=0.3 (m/s up/down), YAW=0.5 (rad/s)"
    cmds:
      - |
        set_param() {
          [ -z "$2" ] && return 0
          case "$2" in *.*) v="$2" ;; *) v="$2.0" ;; esac
          docker exec {{.C}} bash -c "{{.ROS}} && ros2 param set /drone_node $1 $v"
        }
        set_param max_speed "{{.V}}"
        set_param max_vertical_speed "{{.VZ}}"
        set_param max_yaw_rate "{{.YAW}}"

  save:
    desc: "Save the map (map.pcd + map.pgm) to maps/<current map>  (task save MAP=name)"
    vars:
      M: '{{.MAP | default .CURRENT_MAP}}'
    preconditions:
      - sh: docker exec {{.C}} pgrep -f "ros2 launch drone_bringup" >/dev/null 2>&1
        msg: "Simulation is not running"
    cmds:
      - docker exec {{.C}} bash -c "{{.ROS}} && ros2 run drone_slam map_saver.py --ros-args -p output_dir:=/workspace/maps/{{.M}}"

  view:
    desc: Open Gazebo + RViz in the browser
    cmds:
      - open '{{.URL}}'

  status:
    desc: State of the container, simulation and drone
    cmds:
      - |
        if [ -z "$(docker ps -q -f name=^{{.C}}$ -f status=running)" ]; then
          echo "Container:  stopped"; exit 0
        fi
        echo "Container:  running"
        if docker exec {{.C}} pgrep -f "ros2 launch drone_bringup" >/dev/null 2>&1; then
          echo "Simulation: running (map: {{.CURRENT_MAP}})"
          state=$(docker exec {{.C}} bash -c "{{.ROS}} && timeout 10 ros2 topic echo --once /mission/state std_msgs/msg/String --field data 2>/dev/null" | grep -vE '^(WARNING|---)' | head -1)
          echo "Drone:      ${state:-(no answer)}"
        else
          echo "Simulation: stopped"
        fi

  shell:
    desc: Open a shell inside the container
    interactive: true
    cmds:
      - task: _up
      - docker exec -it {{.C}} bash

  _up:
    internal: true
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker Desktop is not running"
      - sh: docker container inspect {{.C}} >/dev/null 2>&1
        msg: "Container {{.C}} does not exist - run: task docker:build"
    status:
      - test -n "$(docker ps -q -f name=^{{.C}}$ -f status=running)"
    cmds:
      - docker start {{.C}} >/dev/null

  _down:
    internal: true
    cmds:
      - |
        if [ -n "$(docker ps -q -f name=^{{.C}}$ -f status=running)" ]; then
          docker stop -t 3 {{.C}} >/dev/null
          echo "Container stopped"
        fi

  _command:
    internal: true
    requires:
      vars: [CMD]
    preconditions:
      - sh: docker exec {{.C}} pgrep -f "ros2 launch drone_bringup" >/dev/null 2>&1
        msg: "Simulation is not running"
    cmds:
      - |
        docker exec {{.C}} bash -c "{{.ROS}} && ros2 topic pub --once -w 1 /drone/command std_msgs/msg/String '{data: {{.CMD}}}'" >/dev/null
      - echo "Sent {{.CMD}}"

  _run:
    internal: true
    interactive: true
    requires:
      vars: [ARGS]
    cmds:
      - task: _up
      - cmd: |
          if ! docker exec {{.C}} test -f /workspace/install/setup.bash; then
            echo "Workspace is not built - run: task build"; exit 1
          fi
          if docker exec {{.C}} pgrep -f "ros2 launch drone_bringup" >/dev/null; then
            echo "A simulation is already running - stop it first: task stop"; exit 1
          fi
      - docker exec {{.C}} bash /workspace/src/drone_bringup/scripts/start_vnc.sh >/dev/null
      - defer: { task: _down }
      - open '{{.URL}}'
      - echo "Gazebo + RViz open in the browser. Ctrl+C here (or task stop) stops the simulation and the container."
      - caffeinate -dims docker exec -it -e DISPLAY=:1 {{.C}} bash -c "{{.ROS}} && exec ros2 launch drone_bringup slam_sim.launch.py {{.ARGS}}"
